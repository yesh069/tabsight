[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tabsight"
dynamic = ["version"]
description = "BI-quality charts, world maps and dashboards from a pandas DataFrame. Rule-based, no LLM, one offline HTML file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.11"
authors = [{ name = "tabsight contributors" }]
keywords = ["dashboard", "visualization", "charts", "maps", "pandas", "echarts", "bi"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
# defusedxml makes openpyxl reject XML bombs; pyarrow >= 15 is after CVE-2023-47248.
excel = ["openpyxl>=3.1", "defusedxml>=0.7"]
parquet = ["pyarrow>=15"]
polars = ["polars>=1.0", "pyarrow>=15"]
# PNG pictures: dukpy draws the SVG, resvg-py (MIT; resvg is Apache-2.0/MIT) turns it into pixels.
png = ["dukpy>=0.6", "resvg-py>=0.5"]
# Server mode inside a web app (ts.web); the CLI's `tabsight serve` needs neither.
web = ["fastapi>=0.110", "flask>=3.0"]
# dukpy (MIT) runs ECharts in Python to draw still SVG pictures: fig.to_svg() and notebook fallbacks.
static = ["dukpy>=0.6"]
docs = [
    # Zensical (MIT) builds the site from mkdocs.yml; it replaces Material for MkDocs (end of life 5 May 2027).
    "zensical>=0.0.73",
    # mkdocstrings 1.0.7+ works under Zensical; older versions crash with recent pymdown-extensions.
    "mkdocstrings[python]>=1.0.7",
    "markdown-callouts>=0.4",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "pip-audit>=2.7",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "pyarrow>=15",
    "dukpy>=0.6",
    "resvg-py>=0.5",
    "fastapi>=0.110",
    "httpx>=0.27",
    "flask>=3.0",
]

[project.scripts]
tabsight = "tabsight.cli:main"

[project.urls]
Homepage = "https://github.com/yesh069/tabsight"
Issues = "https://github.com/yesh069/tabsight/issues"

[project.entry-points.pandas_plotting_backends]
tabsight = "tabsight.plotting"

[tool.hatch.version]
path = "src/tabsight/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tabsight"]

[tool.hatch.build.targets.sdist]
exclude = ["/data-raw", "/tools/node_modules", "/.github", "/site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "node: needs Node.js (JS parity and ECharts checks)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data-raw", "tools/node_modules"]

[tool.ruff.lint]
# S = flake8-bandit security rules (see docs/SECURITY_CHECKLIST.md)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
# Line length is handled by `ruff format`; long message strings and data tables are fine.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These modules handle number text on purpose: minus signs and non-breaking spaces.
"src/tabsight/read.py" = ["RUF001"]
"src/tabsight/formats.py" = ["RUF001"]
"tests/test_read.py" = ["RUF001"]
"tests/test_formats.py" = ["RUF001"]
"tests/test_docs.py" = ["RUF001", "S102"]
"tests/test_html_security.py" = ["RUF001"]
# Tests may use assert and run Node/Python subprocesses with fixed arguments.
"tests/**" = ["S101", "S603", "S607"]
# The server-mode tests talk to a local test server they start themselves.
"tests/test_phase9.py" = ["S310"]
# The vendor fetcher downloads fixed, pinned https URLs (hash-checked afterwards).
"tools/fetch_vendor.py" = ["S310"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tabsight"]

[[tool.mypy.overrides]]
# Optional extras without type information.
module = ["openpyxl", "openpyxl.*", "pyarrow", "pyarrow.*", "polars", "polars.*", "dukpy", "resvg_py",
          "streamlit", "streamlit.*", "dash", "dash.*"]
ignore_missing_imports = true
