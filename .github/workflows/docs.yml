name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[docs,dev]"
      - name: Run every documentation example and check reference tables
        run: python -m pytest tests/test_docs.py
      - name: Build the site with Zensical (warnings are errors)
        run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publishing needs GitHub Pages, which is free only for public repositories
  # (or with a paid plan). The job is skipped while the repository is private.
  deploy:
    if: github.event_name == 'push' && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
