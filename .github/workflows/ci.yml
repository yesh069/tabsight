name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the code but not change the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - name: pip-audit (installed Python packages)
        run: python -m pip_audit --skip-editable
      - name: npm audit (build-time tools only, never shipped)
        run: npm install --ignore-scripts --no-fund && npm audit --audit-level=high
        working-directory: tools

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, pandas ${{ matrix.pandas }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        pandas: ["3"]
        include:
          - { os: ubuntu-latest, python: "3.11", pandas: "2" }
          - { os: ubuntu-latest, python: "3.13", pandas: "2" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: matrix.pandas == '2'
        run: python -m pip install "pandas>=2.2,<3"
      - run: python -m pytest -m "not node"

  node:
    name: node checks (py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/fetch_vendor.py
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: tools
      - run: python -m pytest -m node

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the sdist and wheel
        run: python -m pip install build twine && python -m build
      - name: Check the metadata PyPI will show
        run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/tabsight --version
          /tmp/clean/bin/python - <<'PY'
          import pandas as pd
          import tabsight as ts
          df = pd.DataFrame({"Region": ["West", "East"] * 5, "Sales": range(10)})
          assert ts.chart(df, "bar", x="Region", y="Sales").to_html().startswith("<!doctype html>")
          assert ts.auto(df).to_html().startswith("<!doctype html>")
          print("tabsight", ts.__version__, "works from the wheel")
          PY
